<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi press</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      img {
        cursor: pointer;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <img id="image" src="" onclick="toggleAction()" />
    <div id="count-display">fuck count:<span id="count-variable">0</span></div>

    <script>
      const docImage = document.getElementById("image");
      const docCountNum = document.getElementById("count-variable");

      const imgSources = ["1.png", "2.png"];
      const imgs = imgSources.map((src) => {
        const img = new Image();
        img.src = src;
        return img;
      });

      let currentImgIndex = 0;
      let toggleCount = 0;
      let fuckCount = 0;

      docImage.src = imgs[currentImgIndex].src;
      docCountNum.textContent = fuckCount;

      function toggleAction() {
        toggleCount += 1;
        fuckCount = Math.floor(toggleCount / 2);
        docCountNum.textContent = fuckCount;

        currentImgIndex = (currentImgIndex + 1) % imgs.length;
        docImage.src = imgs[currentImgIndex].src;
      }
    </script>
  </body>
</html>
